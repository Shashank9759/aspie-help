# Publishes the website to GitHub Pages (https://aspie.help)
# - automatically on every push to the main branch
# - manually from the Actions tab ("Run workflow")

name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Check website files
        run: |
          for f in index.html styles.css script.js assets/favicon.svg; do
            test -f "$f" || { echo "::error::Missing file: $f"; exit 1; }
          done
          if grep -q "YOUR-INVITE-CODE" script.js; then
            echo "::warning::The WhatsApp invite link in script.js is still the placeholder."
          fi

      - name: Collect only the files the website needs
        run: |
          mkdir _site
          cp -r index.html styles.css script.js assets _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
